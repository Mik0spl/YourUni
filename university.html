<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>University — YourUni</title>
<meta name="description" content="Rankings, costs, entry requirements, acceptance rate, scholarships, deadlines and quality of life for universities worldwide.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234B3FD0'/><text y='72' x='50' text-anchor='middle' font-size='58' font-family='Georgia,serif' fill='white'>Y</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
<script>
  try { const t = localStorage.getItem('youruni.theme');
        if (t && t !== 'system') document.documentElement.setAttribute('data-theme', t); } catch {}
</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header"></header>

<main id="main">
  <section class="uni-hero" data-hero></section>

  <section class="section--tight">
    <div class="container container--wide">
      <div class="detail-layout">

        <div>
          <div class="tabs" role="tablist" data-tabs>
            <button role="tab" aria-selected="true"  aria-controls="panel-overview"     id="tab-overview">Overview</button>
            <button role="tab" aria-selected="false" aria-controls="panel-requirements" id="tab-requirements">Entry requirements</button>
            <button role="tab" aria-selected="false" aria-controls="panel-cost"         id="tab-cost">Cost &amp; funding</button>
            <button role="tab" aria-selected="false" aria-controls="panel-life"         id="tab-life">Life there</button>
            <button role="tab" aria-selected="false" aria-controls="panel-apply"        id="tab-apply">Applying</button>
          </div>

          <div class="tab-panel" role="tabpanel" id="panel-overview"     aria-labelledby="tab-overview"     data-panel="overview"></div>
          <div class="tab-panel" role="tabpanel" id="panel-requirements" aria-labelledby="tab-requirements" data-panel="requirements" hidden></div>
          <div class="tab-panel" role="tabpanel" id="panel-cost"         aria-labelledby="tab-cost"         data-panel="cost" hidden></div>
          <div class="tab-panel" role="tabpanel" id="panel-life"         aria-labelledby="tab-life"         data-panel="life" hidden></div>
          <div class="tab-panel" role="tabpanel" id="panel-apply"        aria-labelledby="tab-apply"        data-panel="apply" hidden></div>
        </div>

        <aside class="detail-side" data-side></aside>
      </div>
    </div>
  </section>

  <section class="section--tight" data-similar-section>
    <div class="container container--wide">
      <div class="sec-head">
        <div>
          <span class="eyebrow">Also consider</span>
          <h2 data-similar-title>Similar universities</h2>
          <p>Comparable subject strengths, at a range of entry requirements.</p>
        </div>
      </div>
      <div class="grid grid--3" data-similar></div>
    </div>
  </section>
</main>

<footer class="site-footer"></footer>
<script type="module" src="assets/js/pages/university.js"></script>
</body>
</html>
